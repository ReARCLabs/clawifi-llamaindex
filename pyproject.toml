[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-clawifi"
version = "0.1.0"
description = "LlamaIndex tool spec for Clawifi web search and page reading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ReARC Labs Inc." }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "clawifi>=0.4.5,<0.5",
    "httpx>=0.27.2,<1",
]
keywords = ["llama-index", "clawifi", "web-search", "agents", "tools"]

[project.urls]
Homepage = "https://clawifi.dev"
Documentation = "https://clawifi.dev/docs"
Repository = "https://github.com/ReARCLabs/clawifi-llamaindex"
Issues = "https://github.com/ReARCLabs/clawifi-llamaindex/issues"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.13"]

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "tests/", "examples/", "README.md", "LICENSE"]
exclude = ["**/BUILD"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.llamahub]
contains_example = true
import_path = "llama_index.tools.clawifi"

[tool.llamahub.class_authors]
ClawifiToolSpec = "ReARCLabs"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
